name: Arch preview package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/preview-package.yml'
      - 'data/**'
      - 'native/**'
      - 'crates/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'CMakeLists.txt'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git cmake ninja qt6-base qt6-declarative qt6-wayland xdg-desktop-portal rustup python
      - uses: actions/checkout@v4
      - name: Prepare unprivileged builder
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build the ordinary repository preview
        shell: bash
        run: |
          runuser -u builder -- bash -c 'set -euo pipefail; cd "$1"; rustup show; ./bin/build-repository-catalogue --check; cd packaging; makepkg --cleanbuild --force --noconfirm' bash "$GITHUB_WORKSPACE"
      - name: Check packaged contents and record provenance
        shell: bash
        run: |
          python packaging/check-package.py packaging/*.pkg.tar.zst
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > packaging/SOURCE_COMMIT
          cd packaging
          sha256sum ./*.pkg.tar.zst > SHA256SUMS
      - name: Upload reviewable package
        uses: actions/upload-artifact@v4
        with:
          name: omastore-preview-arch-x86_64
          path: |
            packaging/*.pkg.tar.zst
            packaging/SOURCE_COMMIT
            packaging/SHA256SUMS
          if-no-files-found: error
