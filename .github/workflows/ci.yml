name: Native catalogue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-declarative-dev qt6-tools-dev-tools qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript python3
      - name: Use the pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Rust diagnostics
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust protocol boundaries
        run: cargo test --workspace --locked
      - name: Validate public catalogue and HTTP read contract
        run: |
          cargo build --workspace --locked
          target/debug/catalogue-validate data/registry.json
          python3 tests/catalogue_http.py target/debug/catalogue-serve
      - name: Configure native app
        run: cmake --preset dev
      - name: Build native app
        run: cmake --build --preset dev --parallel 2
      - name: Check process and Qt startup
        run: ctest --preset dev
      - name: Stage desktop packaging
        run: cmake --install build --prefix "$PWD/build/stage"
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results
          path: build/Testing/Temporary/
          if-no-files-found: ignore
