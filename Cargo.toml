[workspace]
members = ["crates/catalogue", "crates/workflow", "native/core", "service"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tcballard/OmaStore"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
omastore-catalogue = { path = "crates/catalogue" }
omastore-workflow = { path = "crates/workflow" }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "form", "gzip", "stream"] }
