[workspace]
members = ["crates/catalogue", "native/core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tcballard/OmaStore"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
omastore-catalogue = { path = "crates/catalogue" }
